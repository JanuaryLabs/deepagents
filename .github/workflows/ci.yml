name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DOCKER_CONTEXT: ''
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: JanuaryLabs/zukhruf/.github/actions/setup-workspace@main

      - name: Set SHAs for affected commands
        uses: nrwl/nx-set-shas@v5

      - name: Check Nx workspace sync
        run: npx nx sync:check

      - name: Lint affected
        run: npx nx affected -t lint

      # nx.json runs 14 tasks at once, which suits a workstation. On the runner,
      # that many tasks used all its memory, so these steps run three at once.
      - name: Type check affected
        run: npx nx affected -t typecheck --parallel=3

      - name: Check runner Docker
        run: docker info

      - name: Test affected
        run: npx nx affected -t test --parallel=3

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: |
            **/test-results/*.xml
            **/test-results.xml
          check_name: 'Test Results'
          include_passed: true

      - name: Build affected
        run: npx nx affected -t build --parallel=3
