  - id: X-models-max-2
    name: 'TTFT: router --models-max 2 (LFM3 and embeddinggemma loaded together) on a mixed workload of embeddings and LFM3 chat'
    phase: TTFT
    hypothesis: Llama.app runs the router with --models-max 1. An app that embeds with embeddinggemma and chats with LFM3 on the same Llama.app (for example context-compiler's what-is-going-on) makes the router evict one model for the other, so a request after a switch waits for a model load. With 2 models allowed, both stay loaded.
    combination:
      {
        engine: { models-max: 2 },
        client: {},
        workload: 'new: embeddings to ggml-org/embeddinggemma-2-GGUF:Q8_0 alternating with LFM3 chat requests',
      }
    source:
      [
        'router log ~/Library/Logs/Llama/llama-server.log, 2026-11-08 15:11-15:20 +0300',
      ]
    evidence: 'X-checkpoint-min-step-0-shots attempt 4: "evicting idle LRU name=ggml-org/embeddinggemma-2-GGUF:Q8_0 for a queued request", then LFM3 respawned (load_model initializing about 1.7 s after the spawn); each switch the other way respawned embeddinggemma (about 1.4 s).'
    expected: No load wait after a model switch; TTFT of the first request after a switch drops by about the load time (1.5-9 s with warm-up).
    risks: More memory (LFM3 BF16 3.5 GB plus its KV, embeddinggemma Q8_0 small); the router flag comes from Llama.app, and the Llama.app setting that sets it is not known yet; fit-target 1024 may pick other offloads with two models.
    measure: Custom script, TTFT of LFM3 chat requests that follow an embedding request, and of embedding requests that follow a chat request, models-max 1 vs 2; router log for evictions.
    status: proposed
    attempts: []
    verdict: null

