  - id: X-metal-residency-keepalive
    name: 'TTFT: env GGML_METAL_RESIDENCY_KEEP_ALIVE_S=300 on aisdk-chat after 200 s idle'
    phase: TTFT
    hypothesis: Metal keeps the weight residency set for 180 s; a request after 180 to 300 s idle may pay a re-residency cost.
    combination:
      {
        engine:
          {
            env: 'GGML_METAL_RESIDENCY_KEEP_ALIVE_S=300 (needs Llama.app to pass env)',
          },
        client: {},
        workload: 'new: idle-gap probe after 60/200/290 s',
      }
    in_build_b11960: unverified
    source:
      [
        'https://github.com/ggml-org/llama.cpp/blob/8642541b2/ggml/src/ggml-metal/ggml-metal-device.m#L977',
      ]
    evidence: keep_alive_s = 3*60, overridable by the env var; the runtime ggml is Homebrew ggml 0.28.0, so unverified.
    expected: TTFT after a 200 to 290 s gap equals warm TTFT.
    risks: Llama.app may not forward env vars.
    measure: TTFT after timed idle gaps, 5 repetitions, with and without the env var.
    status: proposed
    attempts: []
    verdict: null

