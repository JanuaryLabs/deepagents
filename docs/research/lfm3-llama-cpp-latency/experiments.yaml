# Catalog of LFM3-on-llama.cpp latency experiments. Format: see README.md in this folder.
# One entry = one named combination (engine + client + workload) against the baseline below.

baseline:
  since: 2026-11-07
  engine:
    ctx-size: 262144
    parallel: 4
    kv-unified: true
    ubatch-size: 256 # E10, E13 (Llama.app selects 2048)
    batch-size: 2048
    spec-default: true # ngram-mod speculative decoding, no draft model
    fit-target: 1024
    sleep-idle-seconds: 900 # the Llama.app setting sleepIdleTime; 300 before the 2026-11-07 17:37 +0300 restart. Never change it here (Ezz keeps auto-unload on purpose)
  build_defaults:
    reasoning-preserve: true # E12
    ctx-checkpoints: 32
    checkpoint-min-step: 8192
    cache-ram: 8192
    cache-idle-slots: true
  client: 'AI SDK through the deepagents `lfm` export; history = response.messages (reasoning sent back as reasoning_content)'

workloads:
  chat-500-5turns:
    tool: guidellm
    data: kind=synthetic_text,first_prompt_tokens=500,prompt_tokens=50,output_tokens=200,turns=5
    profile: set by the experiment (goodput search over streams)
    note: Interactive chat with a short opening message.
  chat-6k-3turns-1user:
    tool: guidellm
    data: kind=synthetic_text,first_prompt_tokens=6000,prompt_tokens=30,output_tokens=200,turns=3
    profile: kind=synchronous
    requests: 9
    note: GuideLLM history drops the reasoning (like a client that keeps only the visible answer).
  chat-6k-5turns-1user:
    tool: guidellm
    data: kind=synthetic_text,first_prompt_tokens=6000,prompt_tokens=30,output_tokens=200,turns=5
    profile: kind=synchronous
    requests: 15
  chat-6k-5turns-4users:
    tool: guidellm
    data: kind=synthetic_text,first_prompt_tokens=6000,prompt_tokens=30,output_tokens=200,turns=5
    profile: kind=concurrent,streams=4
    requests: 40
  sob-4k2-4users:
    tool: guidellm
    data: kind=synthetic_text,prompt_tokens=4200,output_tokens=300
    profile: kind=concurrent,streams=4
    requests: 16
    note: Like SOB text prompts (about 4.2k tokens, 4 at once), single turn.
  long-32k:
    tool: guidellm
    data: kind=synthetic_text,prompt_tokens=32000,output_tokens=50
    profile: kind=synchronous
    requests: 2
  shared-prefix-2k:
    tool: guidellm
    data: kind=synthetic_text,prefix_tokens=2000,prefix_count=1,prompt_tokens=2000,output_tokens=100
    profile: kind=synchronous
    requests: 6
    note: GuideLLM sends the shared prefix as a separate system message (request_handlers.py, line 1030), like SOB few-shot shots before the last user message.
  aisdk-chat:
    tool: AI SDK probe
    description: 3 conversations; turn 1 = 2,800 random words (about 6,150 tokens) + a question, maxOutputTokens 200, temperature 0; turn 2 = history from response.messages + one short question. Measure turn-2 TTFT (first reasoning or text delta) and usage.cachedInputTokens. Uses `lfm('LiquidAI/LFM3-1.7B-GGUF:BF16')` and `streamText`.
  natural-answers:
    tool: guidellm
    status: not defined yet
    description: Requests with no fixed output length, so that the model stops by itself and TTFOT has a value.

experiments:
  - id: E01-speed-baseline
    name: 'baseline: ubatch-size=2048 + spec-default on mixed probes'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: 2048 },
        client: {},
        workload: hand streaming probe,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: hand streaming probe (fetch, SSE timings)
        result: 'warm TTFT 116 ms (20-token prompt); prefill about 2,070 tok/s; decode 50 tok/s with no drafts; 4 concurrent requests: 41 tok/s each, 163 tok/s in total; cold start 8,785 ms'
    verdict: { result: baseline }

  - id: E02-bandwidth-ceiling
    name: 'TPOT: decode limit = memory bandwidth / model size'
    phase: TPOT
    combination: { engine: {}, client: {}, workload: calculation }
    status: done
    attempts:
      - date: 2026-11-07
        tool: calculation + E01
        result: '273 GB/s / 3.467 GB = 78.8 forward passes/s; measured 50 tok/s = 63%'
    verdict:
      {
        result: baseline,
        note: The limit is for forward passes. Batches and speculative drafts give more than one token for each pass.,
      }

  - id: E03-speculation-behavior
    name: 'TPOT: spec-default (ngram-mod) on repeated vs new text'
    phase: TPOT
    combination:
      {
        engine: { spec-default: true },
        client: {},
        workload: 'hand probe, same prompt sent again',
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: hand probe, timings.draft_n / draft_n_accepted
        result: 'repeated text: 192 to 409 tok/s (166 of 200 and 186 of 186 drafts accepted); new text: 3% accepted'
    verdict:
      {
        result: baseline,
        note: Use new text in benchmarks. Repeated prompts make decode seem faster.,
      }

  - id: E04-ttft-vs-prompt-length
    name: 'TTFT: uncached prompt length 127 to 12,385 tokens'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: 2048 },
        client: {},
        workload: 'hand probe, new random text',
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: hand streaming probe
        result: 'about 0.55 ms per prompt token: 674 tokens 360 ms, 1,556 tokens 883 ms, 3,102 tokens 1,603 ms, 6,149 tokens 3,384 ms, 12,385 tokens 7,702 ms'
    verdict:
      {
        result: baseline,
        note: Prefill time increases linearly with prompt length.,
      }

  - id: E05-cache-resend-vs-append
    name: 'TTFT: prompt cache on a repeated prompt and on an appended turn, ubatch-size=2048'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: 2048 },
        client: {},
        workload: 'hand probe, 6,149-token prompt',
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: hand probe + server log
        result: 'both reuse only prompt minus 2,048 tokens (1,145 ms and 1,328 ms against 3,384 ms cold)'
    verdict:
      {
        result: baseline,
        note: The hybrid model state restores only from a context checkpoint.,
      }

  - id: E06-history-format
    name: 'TTFT: history format (reasoning removed / reasoning_content + preserve_thinking / enable_thinking=false), ubatch-size=2048'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: 2048 },
        client:
          {
            variants:
              [
                default,
                'reasoning_content + chat_template_kwargs.preserve_thinking=true',
                'chat_template_kwargs.enable_thinking=false',
              ],
          },
        workload: 'hand probe, 6,190-token first turn',
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: hand probe
        result: 'follow-up TTFT: default 1,129 ms (4,146 cached); reasoning_content + preserve_thinking 497 ms (6,183 cached); enable_thinking=false 1,242 ms (4,135 cached)'
    verdict:
      {
        result: yielded,
        note: 'The history must be equal, token for token, to what the model made.',
      }

  - id: E07-guidellm-chat-baseline
    name: 'TTFT: ubatch-size=2048 on chat-6k-3turns-1user'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: 2048 },
        client: {},
        workload: chat-6k-3turns-1user,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1
        result: 'follow-up TTFT 1,109 to 1,294 ms; cached = prompt minus 2,048 (3,962 of 6,052)'
    verdict: { result: baseline }

  - id: E08-guidellm-inline-reasoning
    name: 'TTFT: multiturn_reasoning=true + extras.body.chat_template_kwargs.preserve_thinking=true on chat-6k-3turns-1user'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: 2048 },
        client: { multiturn_reasoning: true, preserve_thinking: true },
        workload: chat-6k-3turns-1user,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1 (same seed as E07, so first turns were cached too)
        result: 'follow-up TTFT 1,151 to 1,592 ms; 4,046 cached'
    verdict:
      {
        result: no-gain,
        note: GuideLLM puts the reasoning back as text in content. That text is not equal to the cached tokens.,
      }

  - id: E09-prefill-vs-ubatch
    name: 'TTFT: llama-bench prefill at ubatch-size=256/512/1024/2048'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: [256, 512, 1024, 2048] },
        client: {},
        workload: llama-bench -p 4096 -n 0 -b 4096 -r 2,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: llama-bench
        result: '2,118 / 2,159 / 2,182 / 2,182 tok/s'
    verdict:
      { result: yielded, note: A small ubatch makes prefill at most 3% slower. }

  - id: E10-ubatch-sweep-chat
    name: 'TTFT: ubatch-size=256/512/1024/2048 on chat-6k-3turns-1user'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: [256, 512, 1024, 2048] },
        client: {},
        workload: chat-6k-3turns-1user,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1, seeds 7256/7512/8024/9049
        result: 'follow-up TTFT: 256 = 225 ms, 512 = 347 ms, 1024 = 606 ms, 2048 = 1,143 ms; cached 5,771 / 5,515 / 5,003 / 3,983 of 6,073'
    verdict: { result: yielded, note: Applied ubatch-size=256. }

  - id: E11-engine-preserve-thinking
    name: 'TTFT: chat-template-kwargs={"preserve_thinking":true} at ubatch-size=256 on aisdk-chat'
    phase: TTFT
    combination:
      {
        engine:
          {
            ubatch-size: 256,
            chat-template-kwargs: '{"preserve_thinking":true}',
          },
        client: {},
        workload: aisdk-chat,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: AI SDK probe
        result: 'turn-2 TTFT: (a) no setting 297 to 339 ms; (b) with setting 296 to 328 ms; about 5,900 of 6,400 tokens cached in both. A SOB-shaped prompt renders byte-identical with and without the setting (/apply-template).'
    verdict: { result: no-gain, note: Not used. E12 shows why. }

  - id: E12-reasoning-preserve-default
    name: 'diagnostic: why the reasoning stays in the history with no preserve_thinking'
    phase: TTFT
    combination:
      {
        engine: {},
        client: {},
        workload: AI SDK request capture + /apply-template,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: AI SDK probe with a fetch wrapper; llama.cpp source at b11960
        result: 'The AI SDK sends no chat_template_kwargs, and the server still keeps the reasoning. llama.cpp has --reasoning-preserve, enabled by default, for templates with supports_preserve_reasoning (server-context.cpp 1742-1760, common/chat.cpp 1077, common/jinja/caps.cpp 24).'
    verdict:
      {
        result: yielded,
        note: The engine already preserves reasoning. The client must only send it back.,
      }

  - id: E13-ubatch-realistic-ab
    name: 'TTFT/TPOT: ubatch-size=128/256/2048 on chat-6k-5turns-1user, chat-6k-5turns-4users, sob-4k2-4users, long-32k, shared-prefix-2k, aisdk-chat'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: [128, 256, 2048] },
        client: {},
        workload: all six,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1 + AI SDK probe, seeds <ubatch>*100 + 1..5
        labels: { ubatch: 256 }
        result:
          chat-6k-5turns-1user: 'turn-1 TTFT 3,891 ms, later 249 ms, ITL 17 ms, cached 4,563 of 6,088, 46 out tok/s'
          chat-6k-5turns-4users: 'turn-1 7,951 ms, later 682 ms, ITL 34 ms, cached 4,650 of 6,094, 84 out tok/s'
          sob-4k2-4users: 'TTFT 5,332 ms, ITL 42 ms, 65 out tok/s'
          long-32k: 'TTFT 24,719 ms (about 1,300 tok/s prefill), ITL 20 ms'
          shared-prefix-2k: 'TTFT 2,580 ms, cached 0 of 4,015'
          aisdk-chat: 'turn-2 TTFT 332 to 343 ms'
      - date: 2026-11-07
        tool: guidellm 0.8.1 + AI SDK probe
        labels: { ubatch: 128 }
        result:
          chat-6k-5turns-1user: 'turn-1 3,250 ms, later 3,263 ms, cached 1 of 6,094: no prompt cache reuse'
          chat-6k-5turns-4users: 'turn-1 7,705 ms, later 4,785 ms, ITL 75 ms, cached 1 of 6,094, 39 out tok/s'
          sob-4k2-4users: 'TTFT 4,164 ms, ITL 36 ms, 78 out tok/s'
          long-32k: 'TTFT 24,653 ms, ITL 18 ms (1 of 2 requests completed)'
          shared-prefix-2k: 'TTFT 2,481 ms, cached 0 of 4,015'
          aisdk-chat: 'turn-2 TTFT 247 to 272 ms'
      - date: 2026-11-07
        tool: guidellm 0.8.1 + AI SDK probe
        labels: { ubatch: 2048 }
        traffic: '86 proxied requests in the server log = exactly this run (no other client)'
        result:
          chat-6k-5turns-1user: 'turn-1 3,003 ms, later 1,098 ms, ITL 14 ms, cached 3,220 of 6,094, 46 out tok/s'
          chat-6k-5turns-4users: 'turn-1 5,882 ms, later 1,409 ms, ITL 42 ms, cached 3,220 of 6,094, 74 out tok/s'
          sob-4k2-4users: 'TTFT 4,108 ms, ITL 35 ms, 80 out tok/s'
          long-32k: 'TTFT 20,898 ms, ITL 17 ms'
          shared-prefix-2k: 'TTFT 2,247 ms, cached 0 of 4,015'
          aisdk-chat: 'turn-2 TTFT 1,334 to 1,341 ms'
    verdict:
      {
        result: mixed,
        note: 'Follow-ups: 256 is about 4x faster than 2048 (chat 249 vs 1,098 ms; AI SDK 332-343 vs 1,334-1,341 ms). Fresh prompts: 256 looked 12-30% slower than 2048 (SOB-like, 32k, first turns), but E14 shows only 1.6-3.2% from the engine, and the 256 and 128 attempts have no traffic check. See E15. ubatch 128 breaks prompt cache reuse for clients that remove the reasoning; see X-diag-followup-checkpoint-trace.',
      }

  - id: E14-prefill-at-depth-vs-ubatch
    name: 'TTFT: llama-bench prefill pp1024 at depth 0/8192/24576, ubatch-size=256 vs 2048'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: [256, 2048] },
        client: {},
        workload: 'llama-bench -p 1024 -n 0 -b 2048 -d 0,8192,24576 -r 2',
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: llama-bench (llama.cpp 0.8.0, no server)
        result: 'ubatch 256 vs 2048: depth 0 = 2,183 vs 2,220 tok/s (-1.6%); depth 8192 = 1,837 vs 1,884 (-2.5%); depth 24576 = 1,377 vs 1,423 (-3.2%)'
    verdict:
      {
        result: yielded,
        note: 'The engine cost of ubatch 256 is small at every depth. A larger server-side gap must come from something else (other traffic, server scheduling).',
      }

  - id: E15-fresh-prefill-recheck
    name: 'TTFT: ubatch-size=256 vs 2048, paired and traffic-checked, on chat-6k-5turns-1user, sob-4k2-4users, long-32k, shared-prefix-2k'
    phase: TTFT
    combination:
      {
        engine: { ubatch-size: [256, 2048] },
        client: {},
        workload: four fresh-prefill workloads,
      }
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1, seeds <ubatch>*100 + 51..55, 256 then 2048 back to back
        traffic: '40 proxied requests in each server log = exactly this run (no other client)'
        result:
          chat-6k-5turns-1user: '256: turn-1 3,031 ms, later 223 ms, cached 4,650 of 6,094, 51 out tok/s. 2048: turn-1 2,943 ms, later 1,099 ms, cached 3,220, 46 out tok/s'
          sob-4k2-4users: '256: TTFT 3,424 ms, ITL 33 ms, 87 out tok/s. 2048: TTFT 3,668 ms, ITL 37 ms, 76 out tok/s'
          long-32k: '256: 20,383 ms. 2048: 24,418 ms. (E13 had 24,719 vs 20,898: with 2 requests this workload varies by about 2 s in both directions)'
          shared-prefix-2k: '256: 2,197 ms. 2048: 2,249 ms. cached 0 of 4,015 in both'
    verdict:
      {
        result: yielded,
        note: 'With clean traffic, ubatch 256 is equal or faster on fresh prompts and 4.9x faster on chat follow-ups. The 12-30% fresh-prompt penalty in E13 does not reproduce; the E13 256 attempt probably had other clients on the server. Keep ubatch-size=256. Use more than 2 requests for long-32k.',
      }

  # Capacity: the highest load that still meets the latency limits (goodput, DistServe OSDI 2024).
  # GuideLLM goodput profile: it searches the number of concurrent streams for the largest load at
  # which 95% of requests meet every limit. slo.tpot_ms is compared with inter_token_latency_ms.
  - id: X-capacity-chat-interactive
    name: 'throughput: goodput search (TTFT <= 1,000 ms, ITL <= 50 ms, 95%) on chat-500-5turns'
    phase: throughput
    hypothesis: With 4 server slots, interactive chat meets the limits up to about 4 concurrent conversations.
    combination: { engine: {}, client: {}, workload: chat-500-5turns }
    measure: 'guidellm --profile kind=goodput,initial_streams=1,max_streams=16,max_probes=8 --metrics kind=generative,slo.ttft_ms=1000,slo.tpot_ms=50, 45 s per probe; report streams, requests/s, out tok/s and attainment for each probe'
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1 goodput profile (initial_streams 1, max_streams 16, max_probes 8, 45 s per probe), ubatch 256
        labels:
          { experiment: X-capacity-chat-interactive, attempt: 1, ubatch: 256 }
        traffic: 'server proxied requests = GuideLLM requests (clean)'
        result: '1 stream: 100% meet (17 requests), 0.407 req/s, 81 out tok/s, TTFT p95 568 ms, ITL p95 18.3 ms. 2 streams: 92% (24 requests), 0.549 req/s, 110 out tok/s, TTFT p95 1,331 ms, ITL p95 22.0 ms. Best passing: 1 stream.'
      - date: 2026-11-07
        tool: guidellm 0.8.1 goodput profile, 120 s per probe, ubatch 256
        labels:
          experiment: X-capacity-chat-interactive
          run: baseline-120s
        traffic: clean
        result: '1 stream: 97% (37), 0.314 req/s, 63 out tok/s, TTFT p95 305 ms, ITL p95 19.4 ms. 2: 97% (60), 0.507 req/s, 101 tok/s, 499 ms, 24.9 ms. 4: 96% (90, 95% CI 89-98%), 0.753 req/s, 151 tok/s, 695 ms, 32.3 ms. 5: 30%, 0.827 req/s, TTFT p95 3,061 ms. 6: 1%. 8: 0%. GuideLLM best passing streams: 4. Server proxied 506 = sent 506.'
    verdict:
      result: yielded
      note: 'Capacity is 4 concurrent conversations within TTFT <= 1 s and ITL <= 50 ms, at 0.75 req/s and 151 out tok/s. The limit is the parallel=4 slot count: a 5th conversation waits for a slot (see X-parallel-6-8). Attempt 1 (45 s probes) said 1; its samples were too small.'

  - id: X-capacity-chat-6k-doc
    name: 'throughput: goodput search (TTFT <= 4,000 ms, ITL <= 50 ms, 95%) on chat-6k-5turns'
    phase: throughput
    hypothesis: The 6k first turn takes about 3 s at 1 stream, so the 4 s limit is met only at low load.
    combination:
      {
        engine: {},
        client: {},
        workload: chat-6k-5turns-1user (streams set by the search),
      }
    measure: 'same goodput search with slo.ttft_ms=4000,slo.tpot_ms=50'
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1 goodput profile (initial_streams 1, max_streams 16, max_probes 8, 45 s per probe), ubatch 256
        labels: { experiment: X-capacity-chat-6k-doc, attempt: 1, ubatch: 256 }
        traffic: 'server proxied requests = GuideLLM requests (clean)'
        result: '1 stream: 91% meet (11 of 12 requests), TTFT p95 4,107 ms, ITL p95 17.8 ms, 0.257 req/s, 51 out tok/s. The search stopped: no stream count passes.'
      - date: 2026-11-07
        tool: guidellm 0.8.1 goodput profile, 120 s per probe, ubatch 256
        labels:
          experiment: X-capacity-chat-6k-doc
          run: baseline-120s
        traffic: clean
        result: '1 stream: 97% (31), 0.263 req/s, TTFT p95 3,686 ms, ITL p95 18.6 ms. 2: 95% (41), 0.357 req/s, 71 out tok/s, 3,787 ms, 38.3 ms. 3: 80%, ITL p95 61.7 ms. 4: 74%, TTFT p95 9,425 ms, ITL p95 65.8 ms. Best passing streams: 2. Server proxied 181 = sent 181.'
    verdict:
      result: yielded
      note: 'Capacity is 2 concurrent document chats within TTFT <= 4 s and ITL <= 50 ms (0.36 req/s). ITL breaks first: the 6k prefill of other conversations delays decode steps.'

  - id: X-capacity-sob
    name: 'throughput: goodput search (TTFT <= 6,000 ms, ITL <= 50 ms, 95%) on sob-4k2'
    phase: throughput
    hypothesis: SOB-like 4.2k prompts meet a 6 s TTFT up to about 4 concurrent requests.
    combination:
      {
        engine: {},
        client: {},
        workload: sob-4k2-4users (streams set by the search),
      }
    measure: 'same goodput search with slo.ttft_ms=6000,slo.tpot_ms=50'
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1 goodput profile (initial_streams 1, max_streams 16, max_probes 8, 45 s per probe), ubatch 256
        labels: { experiment: X-capacity-sob, attempt: 1, ubatch: 256 }
        traffic: 'server proxied requests = GuideLLM requests (clean)'
        result: '1 stream: 100% (6), 0.140 req/s, TTFT p95 3,752 ms, ITL p95 18.7 ms. 2 streams: 100% (7), 0.163 req/s, TTFT p95 4,821 ms, ITL p95 40.3 ms. 3 streams: 67% (9), ITL p95 57.6 ms. 4 streams: 56% (9), TTFT p95 8,852 ms, ITL p95 57.0 ms.'
      - date: 2026-11-07
        tool: guidellm 0.8.1 goodput profile, 120 s per probe, ubatch 256
        labels:
          experiment: X-capacity-sob
          run: baseline-120s
        traffic: clean
        result: '1 stream: 100% (21), 0.176 req/s, 53 out tok/s, TTFT p95 2,762 ms, ITL p95 17.8 ms. 2: 100% (22), 0.188 req/s, 56 tok/s, 4,531 ms, 37.6 ms. 3: 57%, ITL p95 79.1 ms. 4: 46%, TTFT p95 11,249 ms, ITL p95 82.0 ms. Best passing streams: 2. Server proxied 100 = sent 100.'
    verdict:
      result: yielded
      note: Capacity is 2 concurrent SOB-like requests within TTFT <= 6 s and ITL <= 50 ms (0.19 req/s). ITL breaks first at 3 streams.

  - id: X-parallel-6-8
    name: 'throughput: parallel=6 and parallel=8 (kv-unified, ctx-size 262144 kept) on chat-500-5turns + sob-4k2 goodput searches'
    phase: throughput
    hypothesis: 'The capacity of 4 conversations (X-capacity-chat-interactive, 120 s probes) is the parallel=4 slot count, not the hardware: at 5 streams throughput still rose (0.753 -> 0.827 req/s) while TTFT broke only because the 5th request waited for a slot; ITL p95 at 4 streams was 32 ms, under the 50 ms limit.'
    combination:
      { engine: { parallel: [6, 8] }, client: {}, workload: chat-500-5turns }
    in_build_b11960: 'yes'
    source:
      [
        'router args --parallel 4; models.user.ini comment (4 slots chosen so the 4 largest SOB audio prompts, 251,875 tokens, fit the shared 262,144-token pool)',
      ]
    expected: 'Capacity within TTFT <= 1 s / ITL <= 50 ms rises to the point where ITL or TTFT breaks from compute, not from queueing.'
    risks: 'kv-unified: all slots share 262,144 tokens; SOB 57k audio prompts x 4 already need 251,875, so more slots can overflow the pool when SOB and long chats run together. Check the server log for failed KV allocation.'
    measure: 'capacity-ab.zsh with parallel 6, then 8 (120 s probes): best passing streams, req/s and out tok/s at that load, ITL p95; same for sob-4k2.'
    status: done
    attempts:
      - date: 2026-11-07
