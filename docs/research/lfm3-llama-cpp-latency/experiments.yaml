  - id: X-batch-512-itl
    name: 'TPOT: batch-size=512 on chat-6k-5turns-4users'
    phase: TPOT
    hypothesis: With -b 2048 and -ub 256 one server step can hold 8 ubatches of a new prefill, so other streams wait; -b 512 caps that stall.
    combination:
      {
        engine: { batch-size: 512 },
        client: {},
        workload: chat-6k-5turns-4users,
      }
    in_build_b11960: 'yes'
    source:
      [
        'https://github.com/ggml-org/llama.cpp/blob/8642541b2/tools/server/server-context.cpp#L4480',
      ]
    evidence: The server fills one batch of up to n_batch tokens per step, decode tokens first, then prompt tokens.
    expected: ITL p99 down during concurrent prefill; TTFT of the prefilling request up a little.
    risks: Long prompts span more steps.
    measure: GuideLLM chat-6k-5turns-4users ITL p95/p99, TTFT, out tok/s.
    status: done
    attempts:
      - date: 2026-11-07
        tool: guidellm 0.8.1 goodput searches (X-capacity-*), 120 s per probe, batch-size 512 + ubatch 256, against the baseline-120s run
        labels:
          run: batch512-120s
        traffic: clean (416 / 155 / 30 proxied = sent)
        result:
          chat-500-5turns: 'best 4 streams (96%), 0.810 req/s, 162 out tok/s, TTFT p95 653 ms, ITL p95 30.3 ms; overloaded: 5 streams 0% (baseline 30%), 6-8 streams 0.48-0.69 req/s (baseline 0.80-0.82)'
          chat-6k-5turns: best 2 streams (98%), 0.338 req/s (baseline 0.357)
          sob-4k2: best 1 stream; 2 streams 69% with ITL p95 86.9 ms (baseline 2 streams 100%, 37.6 ms); 0.094-0.135 req/s (baseline 0.176-0.188)
    verdict:
      result: regression
      note: Not used. Interactive chat at 4 streams is 8% faster, but SOB capacity falls from 2 to 1 and ITL gets worse, the opposite of the hypothesis, and throughput collapses when more than 4 conversations arrive. batch-size stays at the default (2048).

  - id: X-kv-q8-long
    name: 'TPOT: cache-type-k=q8_0 + cache-type-v=q8_0 + flash-attn=on on long-32k'
    phase: TPOT
    hypothesis: At 30k to 57k tokens the 6 full-attention layers read 350 to 700 MB of f16 KV per decode step; q8_0 halves that.
    combination:
      {
        engine: { cache-type-k: q8_0, cache-type-v: q8_0, flash-attn: 'on' },
        client: {},
        workload: long-32k,
      }
    in_build_b11960: 'yes'
    source:
      [
        'https://huggingface.co/LiquidAI/LFM3-1.7B/raw/main/config.json',
        'https://github.com/ggml-org/llama.cpp/issues/21450',
      ]
    evidence: '6 full-attention layers x 4 KV heads x 128 = 12,288 bytes/token f16. Mixed K/V types fail on Metal; same-type pairs work.'
    expected: Long-32k ITL -5 to -10%; prefill may slow.
    risks: Small long-context quality drop; never mix K and V types.
    measure: llama-bench -p 32768 -n 128 -ctk/-ctv f16 vs q8_0 -fa 1; GuideLLM long-32k ITL and TTFT.
    status: proposed
    attempts: []
    verdict: null

