pitfalls:
  - id: A1
    attempt: Stop speculative decoding for one request with speculative.n_max=0
    happened: The server ignored it (186 of 186 drafts accepted).
    instead: Change spec-type in the engine settings.
  - id: A2
    attempt: guidellm benchmark run
    happened: GuideLLM 0.8.1 has no benchmark command.
    instead: guidellm run
  - id: A3
    attempt: Run GuideLLM two times with the same seed
    happened: The second run used the prompt cache of the first run.
    instead: Use a new seed for each run.
  - id: A4
    attempt: Start Llama.app immediately after quit
    happened: open failed with error -600 and the server was down for 40 s.
    instead: Repeat open -g -a Llama until it succeeds.
  - id: A5
    attempt: Measure in the first minute after Llama.app starts
    happened: Sometimes the app restarts its router about 40 s after it starts, and all requests in that time fail.
    instead: Monitor the router process ID for about 60 s; check that the GuideLLM errored list is empty.
  - id: A6
    attempt: Use the bandwidth limit as a limit for tokens/s
    happened: Speculative drafts gave 409 tok/s, more than the limit.
    instead: The limit is for forward passes (E02).
  - id: A7
    attempt: Apply the chat history fix to the SOB runner
    happened: The runner sends [...shots, user] and never sends model output back.
    instead: For SOB, examine reuse of the shared few-shot prefix (X-sob-shared-shots-prefix).
  - id: A8
    attempt: Expect a small ubatch to make prefill much slower
    happened: It was 3% slower (E09).
    instead: Measure before you trade one value for another.
  - id: A9
    attempt: Expect a new chat turn to use the full prompt cache
    happened: The default template removes earlier reasoning when the client does not send it (E06).
    instead: Send response.messages (AI SDK).
  - id: A10
    attempt: Read GuideLLM time_per_output_token_ms as decode speed
    happened: It divides the full request time by the output tokens, so it includes the TTFT (514 ms on long-32k).
    instead: Use inter_token_latency_ms.
  - id: A11
    attempt: Expect ubatch 128 to beat 256 for every client (E13)
    happened: Clients that remove the reasoning lost all prompt cache reuse.
    instead: A/B every engine change on all workloads, not only on the target workload.
  - id: A12
    attempt: Compare two settings with one run each on this Mac
    happened: The same parallel-4 one-user chat gave ITL p95 19.4 ms in one run and 30.3 ms in another. The traffic check covers only LFM3 requests; other GPU users (Hex whisper, other sessions, swap) are not visible. A single-run difference of 10-50% can be noise.
    instead: Interleave repeats (A, B, A, B), compare effects larger than the A-to-A spread, and note what else ran on the GPU.
  - id: A13
    attempt: Run a long background benchmark and trust caffeinate to keep the Mac awake
    happened: The lid was closed on battery during X-no-cache-idle-slots-4users attempt 1. Two caffeinate assertions were active, but the Mac went into clamshell sleep for 95 minutes. Requests stalled for up to 19 minutes, and the router traffic check was still clean.
    instead: Start only on AC power. Before you compare an arm, read `pmset -g log` for its time window, and do not use the arm if a Sleep or DarkWake event is in the window. Also compare the wall-clock time of each arm with its expected time.
  - id: A14
    attempt: Trust the router traffic check and the sleep check to show a clean arm
    happened: During X-checkpoint-min-step-0-shots attempt 2, arm b2-step0, another session (a Codex eval) started a CPU-only llama-server that took about 7 cores. The 1-minute load reached 133, and ITL rose 45%. Both checks still passed, because that server is not Llama.app and the Mac did not sleep.
    instead: Sample the processes outside Llama.app during each arm (guard_cpu_start and guard_cpu_stop in ~/.claude/scratch/lfm3-latency/guard.zsh). Do not use an arm in which another process held 3 or more cores in 2 or more samples, 15 s apart.
  - id: A15
    attempt: Run a timed queue on Llama.app while another client uses LFM3
    happened: During X-checkpoint-min-step-0-shots attempt 3, a Codex labeling job sent LFM3 requests to the same router. The traffic check caught them (13 proxied for 6 sent), but the timings were not clean, and the restart before each arm would have broken the other job's requests.
    instead: Before an arm restarts Llama.app, wait until no process other than Llama.app holds a connection to port 9931 for 30 s (guard_clients_wait in guard.zsh). Stop a run with kill -9 when the router is already on the recorded config, so that the exit trap does not restart it again.
