  # Proposed by the 2026-11-07 research pass (primary sources: llama.cpp b11960 source, PRs, LiquidAI docs).
  - id: X-diag-followup-checkpoint-trace
    name: 'TTFT (diagnostic): LLAMA_SERVER_SLOTS_DEBUG=1 + verbose log on chat-6k-5turns-1user and aisdk-chat, ubatch 128 and 256'
    phase: TTFT
    hypothesis: The trace shows which context checkpoint each follow-up restores and why ubatch 128 loses all reuse when the client removes the reasoning.
    combination:
      {
        engine: { verbose: true, env: LLAMA_SERVER_SLOTS_DEBUG=1 },
        client: {},
        workload: chat-6k-5turns-1user,
      }
    in_build_b11960: 'yes'
    source:
      [
        'https://github.com/ggml-org/llama.cpp/blob/8642541b2/src/llama-memory-hybrid.cpp#L173',
        'https://github.com/ggml-org/llama.cpp/blob/8642541b2/tools/server/server-context.cpp#L4250',
        'https://github.com/ggml-org/llama.cpp/pull/24797',
        'https://github.com/ggml-org/llama.cpp/pull/20288',
      ]
    evidence: Hybrid seq_pos_min = max(attention, recurrent), so every follow-up takes the checkpoint-restore path. ggerganov closed PR 24797 ("recurrent state is valid only for the latest position"). No checkpoint is made after generation.
    expected: Facts, not a speedup.
    risks: Verbose logging slows the server; never time with it on.
    measure: Log lines "restored context checkpoint", "old … new …" at the divergence, and n_past per turn.
    status: done
    attempts:
      - date: 2026-11-07
        tool: standalone llama-server b11960 on port 9950 with the Llama.app LFM3 args (parallel 4, kv-unified, spec-default, fit-target 1024) + -v + LLAMA_SERVER_SLOTS_DEBUG=1; guidellm 0.8.1 synchronous, shared-prefix-2k (6 requests) then chat-6k-5turns-1user (15 requests), ubatch 256 then 128 (seeds 53001-53004)
        labels:
          experiment: X-diag-followup-checkpoint-trace
          attempt: 1
          ubatch: 256 / 128
          workload: shared-prefix-2k / chat-6k-5turns-1user
        traffic: own server, no other clients
        result: |
          The restore rule (server-context.cpp:4252-4265): a checkpoint is used only if pos_min < pos_eval - n_swa + 2 (n_swa = 256), or pos_min = 0. Hybrid seq_pos_min = max(attention, recurrent) (llama-memory-hybrid.cpp:173), so every checkpoint records pos_min = pos_max ("created context checkpoint ... pos_min = 2005, pos_max = 2005"). A checkpoint is therefore usable only when it is 254 or more tokens before the first token that differs.
          Checkpoints are made only at user-message starts (the first, the last, and others more than checkpoint-min-step apart), at 4 + n_ubatch and at 4 tokens before the end of the prompt (server-context.cpp:4503-4518). None is made after generation.
          shared-prefix-2k, ubatch 256 and 128: the cached prompt matched 2,011 tokens (lcp 2011). The checkpoints were at 2,005 (start of the user message), 3,754 or 3,882, and 4,010. The threshold was 1,757, so none was usable: "forcing full prompt re-processing", 4,015 of 4,015 tokens evaluated on all 5 repeats.
          chat-6k-5turns-1user (GuideLLM drops the reasoning, so the divergence is at the end of the previous prompt, 6,010): ubatch 256 restored the 4 + 256 checkpoint at 5,750 (threshold 5,756, 6 tokens of margin) and evaluated 302 tokens on all 12 follow-ups. ubatch 128 had its 4 + 128 checkpoint at 5,878, above the threshold, so it restored the checkpoint at position 1 and evaluated 6,051-6,177 tokens (all) on all 12 follow-ups.
    verdict:
      result: baseline
      note: 'Facts. ubatch 256 keeps follow-up reuse with 6 tokens of margin: any ubatch below 250 loses it for clients that drop the reasoning (this explains X-ubatch-128). A shared prefix that ends at the start of the last user message is never reused (this explains X-sob-shared-shots-prefix). Upstream marks the pos_min of checkpoints as wrong for SWA models ([TAG_CHECKPOINTS_FIX_POS_MIN], server-context.cpp:2773, a TODO in b11960). Trace files: ~/.claude/scratch/lfm3-latency/checkpoint-trace/.'

